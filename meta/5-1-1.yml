STAT_CONC_DEF: >-
  The term “legal frameworks” is defined broadly to encompass laws, mechanisms, and policies/plans to ‘promote, enforce and monitor’ gender equality.   Legal frameworks that “promote” are those that establish women’s equal rights with men and enshrine non-discrimination based on sex. Legal frameworks that “enforce and monitor’ are directed to the realization of equality and non-discrimination and implementation of laws, such as policies/plans, the establishment of enforcement and monitoring mechanisms, and allocation of financial resources.
