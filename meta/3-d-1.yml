SDG_INDICATOR: >-
  <p>Indicator 3.d.1: Health sector capacities and available indicators: C1. Political, legal and normative instruments for the implementation of CSR - C1.1. Political, legal and normative instruments; C1.2. Gender equality in medical emergencies;C2. RSI Coordination and National RSI Focal Point - C2.1. Functions of the national focal point for CSR; C2.2. Multisectoral coordination mechanisms; C2.3. Advocacy for the implementation of RSI;C.3. Funding - C3.1. Financing the implementation of RSI; C3.2. Funding for public health emergency response;C4. The laboratory - C4.1. Specimen sending and transport system; C4.2. Implementation of a biosafety and biosecurity regime in the laboratory; C4.3. The quality system of the laboratory; C4.4. Methods of testing capacity in the laboratory; C4.5. National Effective Diagnostics Network;C5. Supervision - C5.1. Early warning surveillance function; C5.2. Event management;C6. Human resources - C6.1. Human resources for the implementation of CSR; C6.2. Incr</p>
