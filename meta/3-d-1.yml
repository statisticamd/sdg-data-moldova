STAT_CONC_DEF: >-
  |
  <p>Data is collected based on a questionnaire. Percentage of attributes of 15 core capabilities that were achieved at a given point in time and 35 indicators. The 15 basic capacities are: Policy, Legal and normative Instruments to implement IHR, IHR Coordination, National IHR Focal Point functions and advocacy, Financing, Laboratory,  Surveillance, Human resources, Health emergency management, Health services provision,  Infection prevention and control (IPC),  Risk communication and community engagement (RCCE), Points of entry (PoEs) and border health,  Zoonotic diseases, Food safety, Chemical events, Radiation emergencies.</p>
  <p>Since 2021 a new SPAR toolkit was  applied ( [IHR State Party Self-Assessment Annual Reporting tool  (SPAR)](https://extranet.who.int/sph/spar))</p>
