STAT_CONC_DEF: >-
  <p> Data is collected based on a questionnaire. Percentage of attributes of 15 core capabilities that were achieved at a given point in time and 35 indicators. The 15 basic capacities are: Policies, legal and normative instruments for the implementation of CSR; RSI Coordination, RSI National Focal Point, Functions and Advocacy; Financing; the laboratory; Supervision; Human resources; Management of health emergencies; Providing healthcare services; Infection prevention and control; Risk Communication and Community Engagement (RCCE); Points of Entry (PoE) and border health; Zoonotic events; Food safety; Chemical events; Radionuclear emergencies.</p> 
  <p>Since 2021 a new SPAR toolkit was  applied ( [IHR State Party Self-Assessment Annual Reporting tool  (SPAR)](https://extranet.who.int/sph/spar)) </p>
