STAT_CONC_DEF: >-
  <p> This indicator will be monitored by the proportion of the population that has convenient access to public transport. The access to public transport is considered convenient when a stop is accessible within a walking distance along the street network of 500 m from a reference point such as a home, school, work place, market, etc. to a low-capacity public transport system (e.g. bus, Bus Rapid Transit) and/or 1 km to a high-capacity system (e.g. rail, metro, ferry). Additional criteria for defining public transport that is convenient include:</p> 
  <p>a. Public transport accessible to all special-needs customers, including those who are physically, visually, and/or hearing-impaired, as well as those with temporary disabilities, the elderly, children and other people in vulnerable situations.</p> 
  <p>b. Public transport with frequent service during peak travel times</p> 
  <p>c. Stops present a safe and comfortable station environment </p>
