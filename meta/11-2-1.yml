SOURCE_TYPE: >-
  <p> Sources of exiting data and recommended:</p> 
  <p>  1) Data on location of public  transport stations in localities: administration of localities or service  providers, GIS data </p> 
  <p>  2) Dwelling units located at a distance of 500 m  from public transport stations: census, GIS data</p> 
  <p>  3) Number of persons per  household: census / household survey  - NBS </p> 
  <p>  4) Household surveys which  collect information regarding the share of households which state that they  have access to public transport means at a distance up to 0.5 km. Household  surveys may collected also information about quality of the service -NSB </p>
