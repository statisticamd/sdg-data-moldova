OTHER_METHOD: >-
  <p> Accordind to the International Conventions, child labour is work that children should not be doing because (a) they are too young or (b) is likely to harm their health, safety or morals, due to its nature or the conditions in which it is carried out.</p> 
  <p>Child labour includes those activities/work that are carried out in activities and/or occupations forbidden to children; and/or in dangerous conditions; or that take excessive working hours. </p>
