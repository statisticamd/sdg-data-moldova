SDG_TARGET__GLOBAL: >-
  <p>Target 8.7: Take immediate and effective measures to eradicate forced labour, end modern  slavery and human trafficking and secure the prohibition and elimination of  the worst forms of child labour, including recruitment and use of child  soldiers, and by 2025 end child labour in all its forms.</p>
