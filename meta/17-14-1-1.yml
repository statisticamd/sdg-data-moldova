STAT_CONC_DEF: >-
  <p>For the purpose of this methodology ‘policy coherence of sustainable development’ has been interpreted as the coherence between policies in general that cover the dimensions of sustainable development. This indicator is a composite indicator which covers mechanisms related to:</p>
  <p>1. Institutionalization of Political Commitment</p>
  <p>2. Long-term considerations in decision-making</p>
  <p>3. Inter-ministerial and cross-sectoral coordination</p>
  <p>4. Participatory processes</p>
  <p>5. Policy linkages</p>
  <p>6. Alignment across government levels</p>
  <p>7. Monitoring and reporting for policy coherence</p>
  <p>8. Financing for policy coherence</p>
