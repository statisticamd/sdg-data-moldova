OTHER_METHOD: >-
  <p>The national mechanisms that ensure the coordination and monitoring the  process of enhancing the coherence of sustainable development policies are the  following: </p>
  <p>- The Interministerial Committee for Strategic Planning (GD. 1070/2023);</p>
  <p>- National Coordination Council for Sustainable Development (GD.  912/2016);</p>
  <p>- Coordinating Councils for SDG in sector policies;  </p>
  <p>- the National framework for monitoring the implementation of the 2030 Sustainable Development Agenda approved (HG 953/2022).</p>
  <p>- Government Decision No. 386/2020 on Strategic Planning</p>
RATIONALE: ''
REC_USE_LIM: ''
DATA_COMP: >-
  <p>This indicator includes 8 domains. Each domain is scored on a scale from 0 to 10, where 0 means none of the requested mechanisms are implemented, 10 means all the requested mechanisms are in place.</p>
  <p>The percentage of points out of the total 80 points is then computed for each country.</p>
