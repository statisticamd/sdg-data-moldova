DATA_COMP: >-
  <p> The number of victims of violent crimes who, in the past 12 months, have filed a complaint with the competent authorities or with other officially recognized conflict resolution mechanisms, relative to the total number of victims of violent crimes reported in a population-based statistical survey 100.</p> 
  <p>Both the number of victims of violent crimes and the total number of victims of violent crimes are estimates based on population sample surveys, most often specialized victimization surveys. </p>
