source_organisation_1: >-
  |
  <p>Data availability:</p>
  <p>The CRS contains flows to all DAC recipient countries. Global and regional figures are based on the sum of ODA and OOF flows to the renewable energy projects. IRENA currently includes data about renewable energy projects in 41 developed countries and 109 developing countries (150 countries overall). </p>
  <p>Time series: OECD: annual data from 1960 onwards (see above). </p>
  <p>IRENA: annual data from 2000 onwards. </p>
  <p>Disaggregation: Data in the CRS contain markers which reflect whether a policy objective is attained through the activity. Measuring gender equality is included in the CRS. Data from the CRS are reported at the project level and can be disaggregated by type of flow (ODA or OOF), by donor, recipient country, type of finance, type of aid (project, agriculture sub-sector, etc.). </p>
  <p>Data in IRENA are stored by country (source and recipient) at the project-level, allowing disaggregation of the data in several dimensions. For example, financial flows can be divided by technologies (i.e. bioenergy, geothermal energy, hydropower, marine energy, solar energy, and wind energy) and sub-technologies (e.g. onshore and offshore wind), by geography (both at the country and regional level), by financial instrument and by type of recipient.</p>
