STAT_CONC_DEF: >-
  <p> Starting  2024, the Environmental Strategy for the years 2024–2030, approved by Government Decision No. 409/2024 will be monitored.</p> 
  <p>The Environmental Strategy for the years 2024–2030 (hereinafter referred to as "the Strategy") is proposed as a sectoral strategy focused on environmental protection, climate change, and natural resources. It outlines national objectives and priorities up to the year 2030 in the following environmental sub-sectors: good environmental governance, prevention of environmental pollution, protection of atmospheric air, sustainable management and protection of water resources, soil resources, mineral resources, biodiversity and natural ecosystems (forests, wetlands, state-protected natural areas, etc.), integrated waste and chemical management, biosafety, ensuring integrated environmental monitoring, climate change mitigation and adaptation, among others.</p> 
  <p>The general objectives of the Strategy are:</p> 
  <p>GO 1. Development of a transparent, efficient, inclusive, and sustainable environmental governance system that ensures compliance with environmental protection requirements;</p> 
  <p>GO 2. Improvement of the quality of surface and groundwater, and the protection and sustainable management of water resources;</p> 
  <p>GO 3. Improvement of air quality and air protection;</p> 
  <p>GO 4. Improvement of soil quality, protection and sustainable use of soil resources and mineral resources;</p> 
  <p>GO 5. Protection, restoration, and promotion of the sustainable use of biodiversity and natural ecosystems;</p> 
  <p>GO 6. Ensuring the development of an integrated waste and chemical management system;</p> 
  <p>GO 7. Reduction of greenhouse gas emissions by 70% by 2030 compared to 1990 under the unconditional scenario (or by 88% under the conditional one), ensuring the Republic of Moldova’s contribution to achieving climate neutrality at the European level by 2050 and increasing the resilience of economic sectors to climate change;</p> 
  <p>GO 8. Promotion of the green economy, improvement of resource efficiency, and development of the circular economy. </p>
