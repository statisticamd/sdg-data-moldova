SDG_INDICATOR_INFO__GLOBAL: >-
  <p> Stakeholder participation is essential to ensure the sustainability of water and sanitation management options over time, e.g. the choice of appropriate solutions for a given social and economic context, and the full understanding of the impacts of a certain development decision. </p> 
  <p>Defining the procedures in policy or law for the participation of local communities is vital to ensure needs of all the community is met, including the most vulnerable and also encourages ownership of schemes which in turn contributes to their sustainability.</p> 
  <p>Local administrative units refers to non-overlapping sub-districts, municipalities, communes, or other local community-level units covering both urban and rural areas to be defined by the government.</p> 
  <p>Policies and procedures for participation of local communities in water and sanitation management would define a formal mechanism to ensure participation of users in planning water and sanitation activities.</p> 
  <p>A policy or procedure is considered to be established if the mechanism for participation of local communities is defined in law or has been formally approved and published. It is considered to be operational if the policy or procedure is being implemented, with appropriate funding in place and with means for verifying that participation took place.</p> 
  <p>‘Water and sanitation’ includes all areas of management related to each of the targets under SDG 6, namely: water supply (6.1), sanitation and hygiene (6.2), wastewater treatment and ambient water quality (6.3), efficiency and sustainable use (6.4), integrated water resources management (6.5) and water-related ecosystems (6.6). </p>
