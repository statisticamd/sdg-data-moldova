STAT_CONC_DEF: >-
  <p> Data of the indicator are collected based on a questionnaire under the UN  Survey - Global Analysis and Assessment of Sanitation and Drinking-water  (GLAAS). The collected data refer to: governance, monitoring, human resources,  and financial resources in the WASH area - water, sanitation and hygiene.</p> 
  <p>Definition:</p> 
  <p>The indicator assesses the percentage of local administrative units (as defined by the national government) that have an established and operational mechanism by which individuals and communities can meaningfully contribute to decisions and directions about water and sanitation management.</p> 
  <p>The indicator Proportion of local administrative units with established and operational policies and procedures for participation of local communities in water and sanitation management is currently being measured by the Proportion of countries with clearly defined procedures in law or policy for participation by service users/communities in planning program in water and sanitation management, and hygiene promotion and the Proportion of countries with high level of users/communities participating in planning programs in water and sanitation management, and hygiene promotion. </p>
