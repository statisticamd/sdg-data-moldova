STAT_CONC_DEF: >-
  |
  <p>Energy from renewable sources means energy produced from renewable non-fossil sources, namely wind energy, solar energy, aerothermal energy, geothermal energy, hydrothermal energy and ocean energy, hydroelectric energy, biomass, biogas, landfill gas, and gas from wastewater treatment installations.</p>
  <p></p>
  <p>Gross energy consumption means energy products supplied for energy purposes to industry, transport, households, services (including public services), agriculture, forestry and fisheries, including the consumption of electricity and thermal energy in the electricity and heat production sector, as well as technological consumption and losses of electricity and thermal energy in electricity and heat networks.</p>
  <p></p>
  <p>Gross final consumption of energy from renewable sources is calculated as the sum of:</p>
  <p>a) gross final consumption of electricity from renewable sources;</p>
  <p>b) gross final consumption of energy from renewable sources for heating and cooling;</p>
  <p>c) gross final consumption of energy from renewable sources in transport.</p>
