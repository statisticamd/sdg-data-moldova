DATA_COMP: >-
  |
  <p>Probability of dying: The likelihood that an individual would die between two ages given current mortality </p>
  <p>rates at each age in between, calculated using life table methods.  </p>
  <p>Life table: A table showing the mortality experience of a hypothetical group of infants born at the same </p>
  <p>time and subject throughout their lifetime to a set of age-specific mortality rates.  </p>
  <p>Cardiovascular disease, cancer, diabetes or chronic respiratory diseases: ICD-10 underlying causes of death I00-I99, COO-C97, E10-E14 and J30-J98, or ICD-11 underlying causes of death 8B00-8B2Z, BA00BE2Z, 2A00-2F9Z, 5A10-5A2Y, CA20- CA2Z, CA60-CA8Z, CA00-CA0Z, CB00-CB0Z, CB20-CB2Z, CB40, CB41, CB60-CB64, CB7Z.</p>
