SDG_INDICATOR_INFO__GLOBAL: >-
  Mortality rate attributed to cardiovascular disease, cancer, diabetes or chronic respiratory disease is defined as theprobability of dying between the ages of 30 and 70 years from cardiovascular diseases, cancer, diabetes or chronic respiratory diseases, defined as the percent of 30-year-old-people who would die before their 70th birthday from cardiovascular disease, cancer, diabetes, or chronic respiratory disease, assuming that s/he would experience current mortality rates at every age and s/he would not die from any other cause of death (e.g., injuries or HIV/AIDS).
