DATA_COMP: >-
  <p> The indicator is calculated in 2 steps:</p> 
  <p>  Step 1: Reporting simple  proportions of: (a) female judges, (b) young judges aged 44 years old and  younger, (c) judges with disabilities and (d) judges from other relevant  national groups of population (e.g. ethnic groups) in the: (i) Constitutional  Court / Supreme Court of Justice; (ii) Higher-level courts (Courts of Appeal) and (iii) Lower-level courts.</p> 
  <p>  Step 2: Generation of ratios to compare the proportion of (a) female judges, (b) young judges aged 44 years old and younger, (c) judges with  disabilities and (d) judges from other relevant groups of population at the  national level in the judicial system at the level of all courts as compared  to the proportion of the same target groups in the working-age population. The  ratios should be calculated for all the levels of the courts, and namely for:</p> 
  <p>   1. Female judges;</p> 
  <p>  2. Young judges aged 44 years old and  younger;</p> 
  <p>  3. Judges with disabilities; </p> 
  <p>  4. Judges  belonging to the relevant groups of population (depending on  the national relevance).</p> 
  <p>  The same approach is used for generating the  ratios for court clerks:</p> 
  <p>  Step 1: Reporting simple proportions of: (a) female court clerks, (b) young court clerks aged 44 years old and younger, (c) court clerks with disabilities  (d) court clerks from other relevant national groups  of population (e.g. ethnic groups) in: (i) the Constitutional Court / Supreme  Court of Justice; (ii) Courts of Appeal  (iii)  Lower-level courts.</p> 
  <p>  Step 2:  Generating ratios that compare the proportion of (a) female court clerks, (b)  young court clerks aged 44 years old and younger, (c) court clerks with  disabilities  (d) court clerks from other relevant national groups of population  from the judicial system of all court levels as compared to proportion of the  same target groups in the working-age population. The ratios should be  calculated for all the court levels, and namely for:</p> 
  <p>  1. Female court clerks;</p> 
  <p>  2. Young court clerks aged 44 years old and younger;</p> 
  <p>  3.  Court clerks with disabilities; </p> 
  <p>  4. Court clerks belonging to other relevant groups of population  ( depending on the national  relevance). </p>
