STAT_CONC_DEF: >-
  By Government Decision no. 314/2012 was approved the Framework Regulation on the organization and functioning of the social service “Personal Assistance” and the Minimum Quality Standards. The purpose of the Service is to provide assistance and care to children and adults with severe disabilities, with a view to favoring their independence and integration into society. The expenses related to the organization and operation of the social service “Personal Assistance” are borne by the service providers and are incurred within the limit of the allocations provided annually in the respective budgets, as well as funds from donations, grants and other sources, according to the legislation. According to the provisions of Law no. 256/2023 on the amendment of some normative acts and Government Decision no. 957/2023 on the establishment, organization and functioning of territorial social assistance agencies, the competences for the development and management of the social assistance system at the second-level local public authorities (LPA II), as of 01.01.2024, are implemented by the Ministry of Labour and Social Protection, through the Territorial Social Assistance Agencies.
