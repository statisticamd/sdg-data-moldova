STAT_CONC_DEF: >-
  |
  <p>Datele sunt colectate în baza unui chestionar. Procentul atributelor a 15  capacități de bază care au fost obținute la un anumit moment dat în timp și 35 de indicatori. Cele  15 capacități de bază sunt:  Instrumente de politici, legislative și normative pentru implementarea RSI; Coordonarea RSI, funcțiile Punctului Focal Național RSI și advocacy; Finanțare; Laborator; Supraveghere; Resurse umane; Managementul urgențelor de sănătate; Furnizarea serviciilor de sănătate; Prevenirea și controlul infecțiilor (IPC); Comunicarea riscurilor și implicarea comunității (RCCE); Puncte de intrare (PoE) și sănătate la frontieră; Boli zoonotice; Siguranța alimentelor; Evenimente chimice; Urgențe radiologice.         </p>
  <p>Din 2021 un nou SPAR chestionar a fost aplicat ( [IHR  State Party Self-Assessment Annual Reporting tool  (SPAR)](https://extranet.who.int/sph/spar))</p>
