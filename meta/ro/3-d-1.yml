SDG_INDICATOR: >-
  <p>Indicator 3.d.1: Capacității sectorului de sănătate și indicatorii disponibili:                                                                                                            C1. Instrumente de politici, legislative și normative pentru implementarea RSI: C1.1 Instrumente de politici, legislative și normative; C1.2 Egalitatea de gen în situații de urgență în sănătate.C2. Coordonarea RSI, funcțiile Punctului Focal Național RSI și advocacy: C2.1 Funcțiile Punctului Focal Național RSI; C2.2 Mecanisme de coordonare multisectorială; C2.3 Promovarea (advocacy) implementării RSI.C3. Finanțare: C3.1 Finanțarea implementării RSI; C3.2 Finanțarea răspunsului la urgențe de sănătate publică.C4. Laborator: C4.1 Sistemul de referire și transport al probelor; C4.2 Implementarea regimului de biosiguranță și biosecuritate în laborator; C4.3 Sistemul de management al calității în laborator; C4.4 Modalități de capacitate de testare de laborator;C4.5 Rețea națională de diagnostic eficientă.C5. S</p>
