STAT_CONC_DEF: >-
  <p> Datele indicatorului sunt colectate în baza unui chestionar în cadrul  Cercetării UN-Water Evaluarea și Analiza Globală a Sanitației și Apei-Potabile  (GLASS). Datele colectate sunt despre: guvernare, monitorizare, resurse umane,  și financiare în domeniul (WASH) apă, sanitație și igienă .</p> 
  <p>Definiţie:</p> 
  <p>Indicatorul evaluează procentul de unități administrative locale (așa cum sunt definite de guvernul național) care au un mecanism stabilit și operațional prin care indivizii și comunitățile pot contribui semnificativ la deciziile și direcțiile privind managementul apei și canalizării.</p> 
  <p>Indicatorul Ponderea autorităților publice locale care dispun de programe/strategii,  proceduri de implicare a comunității în managementul apei și a sanitației este în prezent măsurat de Proporția țărilor cu proceduri clar definite în lege sau în politică de participare a utilizatorilor/comunităților de servicii la programul de planificare în managementul apei și canalizării și promovarea igienei și Proporția țărilor cu nivel ridicat de utilizatori/comunități de promovare a apei și promovarea igienei și a comunităților. </p>
