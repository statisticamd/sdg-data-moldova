SDG_INDICATOR_INFO__GLOBAL: >-
  <p> Participarea părților interesate este esențială pentru a asigura durabilitatea opțiunilor de gestionare a apei și a canalizării în timp, de ex. alegerea soluțiilor adecvate pentru un context social și economic dat și înțelegerea deplină a impactului unei anumite decizii de dezvoltare. </p> 
  <p>Definirea procedurilor în politică sau în lege pentru participarea comunităților locale este vitală pentru a asigura satisfacerea nevoilor întregii comunități, inclusiv a celor mai vulnerabile și, de asemenea, încurajează asumarea schemelor care, la rândul lor, contribuie la sustenabilitatea acestora.</p> 
  <p>Unitățile administrative locale se referă la subdistricte, municipalități, comune sau alte unități locale la nivel de comunitate care nu se suprapun, care acoperă atât zonele urbane, cât și cele rurale, care urmează să fie definite de guvern.</p> 
  <p>Politicile și procedurile de participare a comunităților locale la managementul apei și canalizării ar defini un mecanism formal care să asigure participarea utilizatorilor la planificarea activităților de apă și canalizare.</p> 
  <p>O politică sau o procedură este considerată a fi stabilită dacă mecanismul de participare a comunităților locale este definit prin lege sau a fost aprobat și publicat în mod oficial. Este considerat a fi operațional dacă politica sau procedura este în curs de implementare, cu finanțare adecvată și cu mijloace pentru a verifica dacă a avut loc participarea.</p> 
  <p>„Apă și salubritate” include toate domeniile de management legate de fiecare dintre țintele ODD 6, și anume: alimentarea cu apă (6.1), salubritatea și igiena (6.2), tratarea apelor uzate și calitatea apei ambientale (6.3), eficiența și utilizarea durabilă (6.4), managementul integrat al resurselor de apă (6.5) și ecosistemele legate de apă (6.6). </p>
