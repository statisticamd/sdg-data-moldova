COMPARABILITY: >-
  Pentru anul 2012, indicatorul are la bază datele obținute în cadrul Studiului MICS 2012, realizat la nivel național. Începând cu anul 2021, indicatorul este calculat la nivel național pe baza datelor administrative colectate prin formularele statistice aprobate, conform metodologiei naționale și Standardelor de creștere a copilului ale Organizației Mondiale a Sănătății (OMS).  Din cauza lipsei informațiilor privind numărul copiilor cu vârsta de până la 5 ani evaluați antropometric,  a fost utilizată populația medie anuală a copiilor cu vârsta de până la 5 ani. Valorile obținute reprezintă estimări bazate pe populația copiilor sub 5 ani și pot fi diferiți de indicatorii calculați conform metodologiei standard a Organizației Mondiale a Sănătății (OMS), care utilizează ca numitor numărul copiilor evaluați antropometric.
