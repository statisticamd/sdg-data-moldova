SDG_INDICATOR_INFO__GLOBAL: >-
  Rata mortalității atribuite bolilor cardiovasculare, cancerului, diabetului zaharat sau bolilor respiratorii cronice este definită ca probabilitatea de deces între vârstele de 30 și 70 de ani din cauza bolilor cardiovasculare, cancerului, diabetului zaharat sau bolilor respiratorii cronice. Aceasta reprezintă procentul persoanelor care au împlinit vârsta de 30 de ani și care ar deceda înainte de a împlini 70 de ani din cauza bolilor cardiovasculare, cancerului, diabetului zaharat sau bolilor respiratorii cronice, presupunând că acestea ar fi expuse la ratele actuale de mortalitate specifice fiecărei vârste și că nu ar deceda din alte cauze (de exemplu, traumatisme, accidente sau HIV/SIDA).
