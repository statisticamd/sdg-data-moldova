STAT_CONC_DEF: >-
  <p> Începând cu anul 2024, va fi monitorizată Strategia de mediu pentru anii 2024–2030, aprobată prin Hotărârea Guvernului nr. 409/2024.</p> 
  <p>Strategia de mediu pentru anii 2024-2030 (în continuare – Strategie) se propune a fi una sectorială pentru protecţia mediului, schimbările climatice şi resursele naturale, care include obiectivele şi priorităţile naţionale până anul 2030 în următoarele subdomenii de mediu: buna guvernanţă de mediu, prevenirea poluării mediului, protecţia aerului atmosferic, gestionarea durabilă şi protecţia resurselor de apă, a resurselor de sol, a resurselor minerale utile, a biodiversităţii şi a ecosistemelor naturale (păduri, zone umede, arii naturale protejate de stat etc.), gestionarea integrată a deşeurilor şi a substanţelor chimice, biosecuritatea, asigurarea unui monitoring integrat al mediului, atenuarea şi adaptarea la efectele schimbărilor climatice etc.</p> 
  <p>Obiectivele generale ale Strategiei: </p> 
  <p>OG 1. Dezvoltarea unui sistem de guvernanță de mediu transparent, eficient, incluziv și durabil, care să asigure conformitatea cu cerințele în domeniul protecției mediului;</p> 
  <p>OG 2. Îmbunătățirea calității apelor de suprafață și subterane, protecţia și gestionarea durabilă a resurselor de apă;</p> 
  <p>OG 3. Îmbunătățirea calității şi protecţia aerului;</p> 
  <p>OG 4. Îmbunătățirea calității solului, protecția și utilizarea durabilă a resurselor de sol și a resurselor minerale utile;</p> 
  <p>OG 5. Protejarea, restaurarea şi promovarea utilizării durabile a biodiversității și a ecosistemelor naturale;</p> 
  <p>OG 6. Asigurarea dezvoltării sistemului de management integrat al deșeurilor și al substanțelor chimice;</p> 
  <p>OG 7. Reducerea emisiilor de gaze cu efect de seră până în anul 2030 cu 70% comparativ cu 1990 după scenariul necondiționat (sau cu 88% după cel condiționat) asigurând contribuția Republicii Moldova la obținerea neutralității climatice până în anul 2050 la nivel european și creșterea rezilienței sectoarelor economice la schimbările climatice;</p> 
  <p>OG 8. Promovarea economiei verzi, eficientizarea utilizării resurselor și dezvoltarea economiei circulare. </p>
