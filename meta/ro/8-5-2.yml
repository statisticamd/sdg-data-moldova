STAT_CONC_DEF: >-
  <p>Șomeri BIM (Biroul Internațional al Muncii) sunt persoanele de 15 ani și peste, care îndeplinesc simultan  următoarele condiții:</p>
  <p>a) în cursul săptămânii de referință nu erau ocupate conform definiției persoanelor ocupate, și</p>
  <p>b) erau disponibile să muncească, adică erau disponibile să ocupe un loc de muncă remunerat sau să desfășoare o activitate independentă în termen de două săptămâni după săptămâna de referință; și</p>
  <p>c) căutau activ un loc de muncă, adică fie au făcut demersuri concrete în perioada de patru săptămâni care s-a încheiat cu săptămâna de referință pentru a căuta un loc de muncă remunerat sau pentru a desfășura o activitate independentă, fie au găsit un loc de muncă unde urmează să înceapă activitatea în termen de cel mult trei luni de la sfârșitul săptămânii de referință.</p>
