DATA_COMP: >-
  <p>Rata mortalității atribuibile efectelor combinate ale poluării aerului din gospodării și ale poluării aerului ambiental poate fi exprimată ca rată brută a mortalității sau rată standardizată pe vârstă a mortalității. Ratele brute se calculează prin împărțirea numărului total de decese la populația totală (sau la grupul populațional specificat, dacă este utilizată o altă categorie, de exemplu copiii cu vârsta sub 5 ani). Ratele standardizate pe vârstă ajustează diferențele în structura pe vârste a populației prin aplicarea ratelor specifice de mortalitate pe grupe de vârstă observate în fiecare populație la o populație standard.</p>
  <p>Indicatorul ODD 3.9.1 a fost calculat pentru prima dată conform metodologiei internaționale recomandate de OMS, utilizând funcțiile Integrated Exposure–Response (IER) pentru estimarea riscului relativ asociat expunerii la particule fine PM₂.₅. Fracția atribuibilă (AF) a fost determinată pentru principalele cauze de deces asociate poluării aerului: infecții acute ale căilor respiratorii inferioare, boli cerebrovasculare, cardiopatie ischemică, boală pulmonară obstructivă cronică (BPOC) și cancer pulmonar.</p>
  <p>Dovezile provenite din studiile epidemiologice au demonstrat că expunerea la poluarea aerului este asociată, printre altele, cu următoarele cauze principale de deces luate în considerare la estimarea acestui indicator: Infecții acute ale căilor respiratorii inferioare (estimate pentru toate grupele de vârstă; ICD-10: J09–J22, P23, U04);</p>
  <p>Boli cerebrovasculare (accident vascular cerebral) la adulți (estimate pentru persoanele cu vârsta de peste 25 de ani; ICD-10: I60–I69); Cardiopatie ischemică la adulți (estimate pentru persoanele cu vârsta de peste 25 de ani; ICD-10: I20–I25);</p>
  <p>Boală pulmonară obstructivă cronică (BPOC) la adulți (estimate pentru persoanele cu vârsta de peste 25 de ani; ICD-10: J40–J44); Cancer pulmonar la adulți (estimate pentru persoanele cu vârsta de peste 25 de ani; ICD-10: C33–C34).</p>
