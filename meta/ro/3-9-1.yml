STAT_CONC_DEF: >-
  <p>A fost evaluată mortalitatea rezultată din expunerea la poluarea aerului ambiental (exterior) și la poluarea aerului din gospodării (interior), cauzată de utilizarea combustibililor poluanți pentru gătit și/sau încălzire. Poluarea aerului ambiental provine din emisiile generate de activitățile industriale, gospodării, autoturisme și camioane, reprezentând un amestec complex de poluanți atmosferici, dintre care mulți sunt nocivi pentru sănătate. Dintre acești poluanți, particulele fine în suspensie au cel mai mare impact asupra sănătății umane.</p>
  <p>Prin combustibili poluanți se înțeleg: kerosenul, lemnul, cărbunele, dejecțiile animale utilizate drept combustibil, mangalul (cărbunele vegetal) și reziduurile provenite din culturile agricole.</p>
