STAT_CONC_DEF: >-
  <p> Suprafața totală a spațiilor verzi din cadrul perimetrelor  localităților urbane include suprafața tuturor spațiilor verzi existente în  perimetrul orașului  la sfârșit de an. Spaţiile verzi intravilane sunt spaţii verzi cuprinse în perimetrul construit al oraşului, precum şi masivele verzi alăturate acestora. Nu fac parte din spaţiile verzi: vegetaţia inclusă în fondul forestier, zonele şi fâşiile de protecţie a apelor râurilor şi bazinelor de apă, perdelele de protecţie amplasate pe terenurile cu destinaţie agricolă, perdelele de protecţie şi plantaţiile de arbori şi arbuşti situate de-a lungul căilor de comunicaţie, fondul ariilor naturale protejate de stat, zonele de protecţie ale staţiilor şi posturilor hidrometeorologice şi ale prizelor de apă. Spațiile verzi sunt clasificate conform funcționalității, în conformitate cu articolul 16 al Legii 591/1999 cu privire la spaţiile verzi ale localităţilor urbane şi rurale. Categorii de spații verzi:  1) spații verzi de folosință generală (scuaruri; grădini; parcuri;  păduri-parc; spații verzi din cuprinsul arterelor de circulație); 2) spații  verzi cu acces limitat (parcuri sportive; spații verzi de pe lângă  instituțiile preșcolare, de învățământ și de cercetări științifice; spații  verzi de pe lângă instituțiile sanitare și curative; spații verzi pentru  recrearea copiilor și tineretului; spații verzi  din  incinta   întreprinderilor  și  din  zonele  de protecție ale acestora; spații verzi de  pe lângă locuințe); 3) spații verzi cu profil specializat  (grădini botanice;   grădini dendrologice;  grădini și parcuri zoologice; parcuri pentru expoziții;  grădini de trandafiri, liliac, plante alpine, etc.; plantații în cimitire); 4)  spații verzi cu funcții utilitare (plantații pentru consolidarea terenurilor;  plantații de protecție a surselor de apă; plantații de protecție contra  incendiilor); 5) spații verzi din zonele turistice și de agrement.</p> 
  <p>Suprafața totală a străzilor orășenești, inclusiv  suprafața trotuarelor, se referă la suprafața tuturor străzilor, căilor (bulevarde, șosele, stradele, fundături, piețe, inclusiv cele de lângă  gări și stadioane) cu îmbrăcăminte sau fără, situate între fațadele  clădirilor, inclusiv suprafața podurilor, viaductelor, drumurilor de acces la  acestea, existente la sfârșitul anului de raportare în perimetrul orașului. </p> 
  <p>Suprafața terenurilor din intravilanul  localităților urbane este constituit  din următoarele terenuri: 1)  suprafața terenurilor pe care sunt construite  cartiere de locuințe, 2) suprafață terenurilor pe care sunt construite  întreprinderi de producție și de transport, 3) teritoriile dintre cartierele  de locuințe și cele învecinate, terenurile ocupate de străzi, piețe, cheiuri,  4) terenurile utilizate pentru organizarea odihnei populației, spații de  utilitate publică (parcuri, grădini, scuare etc.), 5) suprafețele de apă cu  excepția piscinelor, cimitirelor, terenurilor cu destinație specială, 6)  terenurilor aflate în zona de expropriere (a căilor ferate, şoselelor,  construcțiilor portuare, aerodromurilor etc.), 7) terenurile ocupate de  construcțiile de apărare a statului (poligoane, câmpuri de tragere, cetăți,  cazărmi), rezervațiile și terenurile asimilate scoase de sub jurisdicția  autorităților publice locale. </p>
