SDG_INDICATOR_INFO: >-
  |
  <p>În conformitate cu prevederile Regulamentul-cadru cu privire la mecanismul de finanțare nerambursabilă a proiectelor organizațiilor necomerciale, aprobat prin Hotărârea Guvernului nr.656/20221 finanțarea de stat poate fi oferită OSC-urilor prin mecanisme precum finanțarea nerambursabilă, contractarea de lucrări și servicii sau prin finanțare cu destinație specială, inclusiv comanda socială, mecanismul de desemnare procentuală și subvenții directe către OSC-uri. Resursele alocate în acest scop sunt prevăzute în bugetul de stat și în bugetele locale. </p>
  <p>În contextul prevederilor hotărârii menționate, orice autoritate a administrației publice centrale sau locale poate deveni autoritate finanțatoare, organizând, în acest scop, anual concursuri publice de finanțare a proiectelor din domeniile de dezvoltare, care pot fi realizate de organizațiile necomerciale.</p>
