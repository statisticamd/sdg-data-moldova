DATA_COMP: >-
  <p> Acest indicator include 8 domenii. Fiecare domeniu este evaluat pe o scală de la 0 la 10, unde 0 înseamnă că niciunul dintre mecanismele solicitate nu este implementat, iar 10 înseamnă că toate mecanismele solicitate sunt implementate.</p> 
  <p>Procentul de puncte din totalul de 80 de puncte este apoi calculat pentru fiecare țară. </p>
