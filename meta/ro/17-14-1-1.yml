STAT_CONC_DEF: >-
  <p> În sensul acestei metodologii, „coerența politicilor dezvoltării durabile” a fost interpretată ca fiind coerența dintre politicile în general care acoperă dimensiunile dezvoltării durabile. Acest indicator este un indicator compozit care acoperă mecanisme legate de:</p> 
  <p>1. Instituționalizarea angajamentului politic</p> 
  <p>2. Considerații pe termen lung în procesul decizional</p> 
  <p>3. Coordonare interministerială și intersectorială</p> 
  <p>4. Procese participative</p> 
  <p>5. Legături de politici</p> 
  <p>6. Aliniere între nivelurile guvernamentale</p> 
  <p>7. Monitorizarea și raportarea pentru coerența politicilor</p> 
  <p>8. Finanțarea pentru coerența politicilor </p>
