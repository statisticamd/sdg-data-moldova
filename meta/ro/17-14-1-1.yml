OTHER_METHOD: >-
  <p> În calitate de mecanisme naționale care asigură coordonarea și monitorizarea  procesului de consolidare a coerenței politicilor de dezvoltare durabilă sunt  considerate: </p> 
  <p>- Comitetul interministerial pentru planificare strategică (HG 1070/2023);</p> 
  <p>- Consiliul Național  de Coordonare pentru Dezvoltare Durabilă (HG.  912/2016);</p> 
  <p>- Consiliile Coordonatoare pentru ODD-uri  în politicile sectoriale;  </p> 
  <p>-Cadrul naţional de monitorizare a implementării Agendei de Dezvoltare Durabilă 2030 aprobat (HG 953/2022).</p> 
  <p>- Hotărârea Guvernului nr. 386/2020 cu privire la planificarea strategică </p>
