SOURCE_TYPE: >-
  <p> Există mai multe surse de date care ar putea fi utilizate:</p> 
  <p>1. Documente oficiale precum Planul Urbanistic Național, Cadrele, Strategiile etc. Disponibile în administrațiile naționale sau regionale.</p> 
  <p>2. Alte instrumente de sprijin, cum ar fi: cartografierea datelor spațiale de referință, evaluarea comparativă, anchetele la punctele de serviciu, monitorizarea și raportarea performanței, decalajul și analiza de continut.</p> 
  <p>3. Baza de date a politicilor urbane naționale a Națiunilor Unite - și alte organizații internaționale, ONU-Habitat a dezvoltat o bază de date națională a politicilor urbane ca un depozit de documente oficiale de politici urbane și aferente; ONU-Habitat a dezvoltat, de asemenea, UrbanLex, o bază de date cu legi și politici privind problemele urbane. </p>
