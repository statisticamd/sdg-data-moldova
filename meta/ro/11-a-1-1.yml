STAT_CONC_DEF: >-
  Multe ODD-uri legate de urban necesită monitorizare globală cu „orașul” ca unitate de analiză. Pentru a monitoriza în special ODD-urile urbane, este necesar să se convină asupra unei definiții globale/comune a ceea ce constituie un „oraș”. O definiție standard a orașului va ajuta la monitorizarea ODD-urilor prin asigurarea faptului că ariile de studiu pentru ODD-urile urbane spațiale sunt standardizate și ușor reproducibile, și va adăuga claritate metodelor și abordărilor pentru colectarea de date care să susțină indicatorii legati de teren și zonele rurale. UN-Habitat, în colaborare cu Universitatea din New York și Centrul Comun de Cercetare al Comisiei Europene, a adoptat două definiții ale orașelor.                               Definițiile sunt:                                                                                                                                       a) Oraș definit de limita suprafeței sale construite - Universitatea din New York. Zona construită a unui oraș este definită ca zona adiacentă ocupată de clădiri și alte suprafețe construite, inclusiv zonele urbane libere din și în jurul acestora, dar excluzând zonele rurale dincolo de marginea urbană.                                                         b) Grad de urbanizare (DEGURBA) -Comisia Europeană-JRC Gradul de urbanizare este definit ca clasificarea unităților administrative locale de nivelul 2 sau a comunelor în trei tipuri: orașe (dens populate), orașe sau suburbii (densitate intermediară) și zone rurale (zone slab populate) pe baza ponderii populației locale care trăiește în clustere urbane și centre urbane.
