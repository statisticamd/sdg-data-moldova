STAT_CONC_DEF: >-
  |
  <p>Termenul „cadru legal” este definit în sens larg și  cuprinde legi, mecanisme și politici/planuri care „promovează, aplică și monitorizează” egalitatea de gen.</p>
  <p>Cadrul legal care „promovează” este legislația care consacră drepturi egale pentru femei și bărbați și interzice discriminarea pe bază de sex. Cadrul legal care „aplică și monitorizează” este orientat spre realizarea egalității și nediscriminării și punerea în aplicare a legilor, prin politici/planuri, crearea de mecanisme de aplicare și monitorizare, precum și alocarea de resurse financiare.</p>
