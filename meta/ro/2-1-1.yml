DATA_COMP: >-
  <p> Pentru a calcula o estimare a prevalenței subnutriției într-o populație, distribuția probabilității nivelurilor de aport energetic alimentar obișnuit (exprimate în kcal pe persoană pe zi) pentru individul mediu este modelată ca o funcție parametrică a densității de probabilitate (pdf), f(x).</p> 
  <p></p> 
  <p>Indicatorul se obține ca probabilitatea cumulativă ca aportul energetic alimentar obișnuit (x) să fie sub necesarul minim de energie alimentară (MDER) (adică limita inferioară a intervalului de necesar energetic pentru individul mediu reprezentativ al populației). </p>
