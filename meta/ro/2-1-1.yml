STAT_CONC_DEF: >-
  <p> „Subnutriția este definită ca fiind starea prin care o persoană are acces, în mod regulat, la o cantitate de alimente insuficientă pentru a-i asigura energia necesară pentru a duce o viață normală, sănătoasă și activă, având în vedere propriile nevoi energetice alimentare.</p> 
  <p></p> 
  <p>Deși strict legată, «subnutriția», așa cum este definită aici, este diferită de condițiile fizice de «malnutriție» și «subnutriție», deoarece se referă la starea de aport insuficient de alimente, mai degrabă decât la rezultatul în ceea ce privește starea nutrițională. În franceză, spaniolă și italiană, diferența este marcată de utilizarea termenilor «alimentación», «alimentación» sau «alimentazione», în loc de «nutrition», «nutrición» sau «nutrizione» în numele indicatorului. O expresie mai potrivită în limba engleză, care ar reda sensul precis al indicatorului, ar fi putut fi «prevalența subalimentării», dar până acum termenul «subnutriție» este de mult timp asociat cu indicatorul.</p> 
  <p></p> 
  <p>Deși starea de subnutriție se aplică indivizilor, din cauza unor considerații conceptuale și legate de date, indicatorul poate fi referit doar la o populație sau un grup de persoane.” indivizi. Prevalența subnutriției este, așadar, o estimare a procentului de indivizi dintr-un grup care se află în acea condiție, dar nu permite identificarea indivizilor din grup care sunt, de fapt, subnutriți. </p>
