STAT_CONC_DEF: >-
  <p> Violenţa fizică din partea soțului/partenerelui a presupus survenirea a cel puţin uneia din următoarele situaţii:</p> 
  <p>- pălmuirea sau aruncarea cu ceva în direcţia femeii; </p> 
  <p>- împingerea, bruscarea sau tragerea de păr; </p> 
  <p>- lovirea cu pumnul sau cu altceva care ar putea provoca dureri; </p> 
  <p>-lovirea cu piciorul sau bătaia; strangularea sau provocarea intenţionată a arsurilor; </p> 
  <p>-ameninţarea sau aplicarea de facto a armei sau a altor obiecte periculoase/arme reci (cuţit, topor, coasă, etc.).</p> 
  <p>Violența fizică din partea altor persoane decît soţul/ partenerul:</p> 
  <p>- femeia a fost cel puţin o dată împinsă, trasă de păr, lovită, bătută, pălmuită sau a suferit de alte acţiuni de violenţă fi zică din partea oricărei alte persoane decît soţul/partenerul.</p> 
  <p>Violenţa sexuală comisă de soţ/partener a presupus survenirea a cel puţin uneia din următoarele situaţii:</p> 
  <p>- impunerea forţată la întreţinerea relaţiilor sexuale/actului sexual contrar voinţei;</p> 
  <p>- impunerea forţată a practicilor degradante şi umilitoare în timpul actului sexual contrar voinţei;</p> 
  <p>- relaţii sexuale acceptate din cauza fricii.</p> 
  <p>Violenţa sexuală comisă de alte persoane decît soţul/ partenerul:</p> 
  <p>- femeia a fost cel puţin o dată în situaţia de a fi  forţată să întreţină relaţii sexuale/act sexual nedorit prin ameninţare sau crearea situaţiei cînd nu a putut refuza. Nu au fost considerate tentativele de forţare care nu au rezultat în act sexual. </p>
