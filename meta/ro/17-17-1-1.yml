STAT_CONC_DEF: >-
  <p> Programul de dezvoltare a organizațiilor societății civile pentru</p> 
  <p>perioada 2024-2027, aprobat prin Hotărârea Guvernului nr. 845/2023, reprezintă o continuitate a Strategiei de dezvoltare a societății civile pentru perioada 2018-2020, având drept scop susținerea și promovarea dezvoltării organizațiilor societății civile prin consolidarea mecanismelor de colaborare cu statul. Programul este axat pe 3 obiective generale, care vor contribui la transparentizarea procesului de luare a deciziilor, fortificarea capacităților funcționarilor publici și a reprezentanților organizațiilor societății civile, sporirea implicării organizațiilor societății civile în procesul decizional, creșterea stabilității finaciare a OSC ș.a. </p> 
  <p>Monitorizarea implementării programului este asigurată de Cancelaria de Stat, în modul descris în capitolul IX al documentului Procedurile de raportare. Rapoartele de monitorizare sunt elaborate semestrial. </p>
