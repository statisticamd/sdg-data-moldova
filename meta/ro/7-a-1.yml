SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 7.a.1: Valoarea asistenței financiare și tehnice externe  pentru  dezvoltarea eficienței energetice</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 7.a: Până în 2030, consolidarea cooperării naționale pentru facilitarea accesului  la cercetări și tehnologii energetice curate, inclusiv energia regenerabilă,  eficiența energetică și tehnologia avansată și mai curată de utilizare a  combustibililor fosili, precum și promovarea investițiilor în infrastructura  energetică și tehnologii energetice curate.</p>
