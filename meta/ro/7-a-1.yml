source_organisation_1: >-
  |
  <p>Disponibilitatea datelor:</p>
  <p>CRS conține fluxuri către toate țările beneficiare ale DAC. Valorile globale și regionale se bazează pe suma fluxurilor de AOD (asistență oficială pentru dezvoltare) și OOF (alte fluxuri oficiale) către proiecte de energie regenerabilă.</p>
  <p>International Renewable Energy Agency include în prezent date despre proiecte de energie regenerabilă din 41 de țări dezvoltate și 109 țări în curs de dezvoltare (150 de țări în total).</p>
  <p>Serii de timp:</p>
  <p>Organisation for Economic Co-operation and Development: date anuale începând din 1960.</p>
  <p>IRENA: date anuale începând din 2000.</p>
  <p>Dezagregare:</p>
  <p>Datele din CRS conțin indicatori (markeri) care reflectă dacă un obiectiv de politică este atins printr-o anumită activitate. Evaluarea egalității de gen este inclusă în CRS. Datele sunt raportate la nivel de proiect și pot fi dezagregate după tipul fluxului (AOD sau OOF), donator, țară beneficiară, tip de finanțare și tip de ajutor (proiect, subsector agricol etc.).</p>
  <p>Datele IRENA sunt stocate la nivel de proiect, pe țări (sursă și beneficiar), permițând dezagregarea pe mai multe dimensiuni. De exemplu, fluxurile financiare pot fi împărțite după tehnologii (bioenergie, energie geotermală, hidroenergie, energie marină, energie solară și energie eoliană) și subtehnologii (de exemplu, eolian onshore și offshore), precum și după regiune, instrument financiar și tip de beneficiar.</p>
