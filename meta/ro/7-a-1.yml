OTHER_METHOD: >-
  |
  <p>Organisation for Economic Co-operation and Development / Development Assistance Committee colectează date privind fluxurile de resurse oficiale și private începând din 1960 la nivel agregat și din 1973 la nivel de activitate, prin intermediul Sistemului de Raportare a Creditorilor (CRS). Datele CRS sunt considerate complete din 1995 pentru angajamente la nivel de activitate și din 2002 pentru plăți. Datele sunt raportate anual, pe baza anului calendaristic, de către instituțiile statistice din administrațiile naționale (agenții de ajutor, ministere de externe sau finanțe etc.).</p>
  <p>Datele International Renewable Energy Agency privind fluxurile financiare din surse publice în sprijinul energiei regenerabile sunt disponibile în Baza de date a investițiilor publice în energie regenerabilă a IRENA. IRENA colectează aceste date dintr-o gamă largă de surse publice, inclusiv baze de date și rapoarte anuale ale principalelor instituții de finanțare a dezvoltării și ale altor 20 de agenții bilaterale și multilaterale care investesc în energie regenerabilă.</p>
  <p>Baza de date este actualizată anual și (la sfârșitul anului 2021) acoperă investiții publice în energie regenerabilă în 41 de țări dezvoltate și 109 țări în curs de dezvoltare, pentru perioada 2000–2020. Pe măsură ce noi instituții financiare publice încep să investească în energie regenerabilă, baza de date IRENA se va extinde pentru a include acești noi investitori în timp.</p>
