SDG_INDICATOR_INFO: >-
  |
  <p>Fluxurile OECD sunt calculate ca totalul fluxurilor oficiale (AOD și OOF) provenite de la țările membre DAC, organizații multilaterale și alți furnizori de asistență pentru dezvoltare către sectoarele relevante. Fluxurile suplimentare IRENA sunt calculate pe baza investițiilor publice din baza de date IRENA privind investițiile în energie regenerabilă, excluzând: fluxurile financiare interne; fluxurile internaționale către țări din afara regiunilor în curs de dezvoltare; fluxurile către beneficiari multilaterali nespecificați; și fluxurile deja raportate de Organisation for Economic Co-operation and Development.</p>
  <p>Fluxurile sunt exprimate ca angajamente, măsurate în dolari SUA (USD) curenți, și sunt urmărite la nivel de proiect sau activitate individuală. În cazul în care există suprapuneri între bazele de date OECD și International Renewable Energy Agency, acestea sunt eliminate din setul de date IRENA pentru a evita dubla contabilizare.</p>
  <p>Valorile sunt convertite în USD constanți, utilizând un an de bază care, de regulă, are un decalaj de doi ani față de anul publicării. Conversia se realizează conform metodologiei deflatorului DAC, descrisă de OECD.</p>
