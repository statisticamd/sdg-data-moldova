source_other_info_1: >-
  <p> În anul 2022 a fost aprobat Programul de prevenire și gestionare a situațiilor de urgență și excepționale pentru anii 2022–2025, prin Hotărârea Guvernului nr. 846/2022, autoritatea responsabilă pentru monitorizarea implementării acestuia fiind Ministerul Afacerilor Interne (MAI).</p> 
  <p></p> 
  <p>În anul 2024, Ministerul Mediului a elaborat Strategia națională de reducere a riscurilor de dezastre pentru perioada 2024–2030.</p> 
  <p>Documentul constituie un instrument de realizare a angajamentelor asumate de Republica Moldova în vederea implementării prevederilor Cadrului de la Sendai, Agendei 2030 pentru Dezvoltare Durabilă și Acordului de la Paris.</p> 
  <p>De asemenea, către secretariatul Convenției a fost expediat Raportul Național de Progres privind Cadrul de Monitorizare Sendai. </p>
