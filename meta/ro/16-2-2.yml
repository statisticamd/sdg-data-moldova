STAT_CONC_DEF: >-
  Trafic de ființe umane (trafic de persoane adulte sau trafic de copii, Articolul 165 și 206 din Codul Penal) -  recrutarea, transportarea, transferul, adăpostirea sau primirea unei persoane adulte, cu sau fără consimţămîntul acesteia, în scopul exploatării sexuale comerciale sau necomerciale, al exploatării prin muncă sau servicii forţate, al practicării cerşetoriei, al însuşirii ajutoarelor, indemnizaţiilor sau prestaţiilor sociale, al folosirii ilegale în testări sau experimente medicale ori ştiinţifice, al exploatării în sclavie sau în condiţii similare sclaviei, al folosirii în conflicte armate ori în activităţi criminale, al prelevării organelor, ţesuturilor şi/sau celulelor umane, precum şi al folosirii femeii în calitate de mamă-surogat ori în scop de reproduce, săvârșite prin: aplicarea violenţei nepericuloase pentru viaţa sau sănătatea persoanei ori cu ameninţarea aplicării violenţei, răpire, sustragerea, tăinuirea, degradarea sau distrugerea documentelor, ţinerea în servitute, în scopul întoarcerii unei datorii, ameninţare cu divulgarea informaţiilor confidenţiale familiei victimei sau altor persoane fizice sau juridice, înşelăciune, abuz de poziţie de vulnerabilitate sau abuz de putere, dare ori primire a unor plăţi sau beneficii pentru a obţine consimțământul unei persoane care deţine controlul asupra altei persoane. Victimă a  traficului de ființe umane – persoană fizică constatată ca fiind supusă  acțiunilor de trafic menționate. (art. 2, alin. 1 și 11 din Legea nr. 241 din   20.10.2005 privind prevenirea și combaterea traficului de ființe umane).
