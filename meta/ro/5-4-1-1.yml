STAT_CONC_DEF: >-
  Serviciul social „Asistenţă personală” este un serviciu social specializat, instituit prin decizia autorităţilor administraţiei publice locale de nivelul al doilea şi ale municipiului Bălţi, care are scopul de a oferi asistenţă şi îngrijire copiilor şi adulţilor cu dizabilităţi severe, în vederea favorizării independenţei şi integrării lor în societate (în domeniile: protecţie socială, muncă, asistenţă medicală, instructiv-educativ, informaţional, acces la infrastructură etc.). Prin Hotărârea Guvernului nr. 314/2012 a fost aprobat Regulamentul-cadru privind organizarea și funcționarea serviciului social „Asistență personală” și Standardele minime de calitate. Cheltuielile ce țin de organizarea și funcționarea serviciului social „Asistență personală” sunt suportate de către prestatorii serviciului și sunt efectuate în limita alocațiilor prevăzute anual în bugetele respective, precum și a mijloacelor provenite din donații, granturi și alte surse, conform legislației. Conform prevederilor Legii nr. 256/2023 pentru modificarea unor acte normative și Hotărîrii Guvernului nr. 957/2023 cu privire la constituirea, organizarea și funcționarea agențiilor teritoriale de asistență socială, competențele de dezvoltare și gestionare a sistemului de asistență socială de la nivelul autorităților publice locale de nivelul doi (APL II), din data de 01.01.2024, sunt implementate de către Ministerul Muncii și Protecției Sociale, prin intermediul Agențiilor Teritoriale de Asistență Socială.
