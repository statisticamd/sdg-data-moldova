  Criteriul definitoriu constant folosit la clasificarea întreprinderilor mici şi mijlocii (ÎMM) în scopuri statistice este numărul mediu anual de salariați (Conform art.5, alin. 2 din Legea nr. 179/2016 cu privire la întreprinderile mici şi mijlocii). Sectorul întreprinderilor mici si mijlocii cuprinde întreprinderile care au un număr mediu anual de pînă la 250 de salariați (Conform art.4, alin. 1, lit. a) din Legea nr. 179/2016 cu privire la întreprinderile mici şi mijlocii).
