STAT_CONC_DEF: >-
  Proporția femeilor cu vârsta între 15 - 49 de ani (căsătorite sau aflate într-o uniune) care iau propriile decizii în toate cele trei domenii selectate: decid singure cu privire la îngrijirea propriei sănătăți; decid asupra utilizării contracepției; și pot refuza raporturi sexuale cu soțul sau partenerul dacă nu doresc acest lucru. Sunt considerate ca luând propriile decizii privind sănătatea sexuală și reproductivă doar femeile care răspund „da” la toate cele trei componente. O uniune presupune un bărbat și o femeie care coabitează în mod regulat într-o relație similară căsătoriei.
