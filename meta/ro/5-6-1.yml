DATA_COMP: >-
  |
  <p>Numărul femeilor în vârstă de 15-49 ani căsătorite sau într-o uniune care iau  decizii independente cu privire la relațiile sexuale, utilizarea  contracepției, sănătatea sexuală și reproductivă raportat la numărul total al  femeilor în vârstă de 15-49 ani căsătorite sau într-o uniune * 100,</p>
  <p>Unde:</p>
  <p>Numărătorul: Numărul femeilor în vârstă de 15-49 ani căsătorite sau  într-o uniune care îndeplinesc următoarele criterii: </p>
  <p>  - pot spune „nu”  sexului;</p>
  <p>  - decizia privind utilizarea contracepției nu este luată în principal de soț/partener;</p>
  <p>  - decizia privind propria sănătate nu este luată, de obicei, de soț/partener sau de o altă persoană; </p>
  <p>Numitorul: Numărul total al femeilor în vârstă de 15-49 ani  căsătorite sau într-o uniune.</p>
  <p>Proporția: (Numărătorul /Numitor) * 100.</p>
