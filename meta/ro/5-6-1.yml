SDG_TARGET__GLOBAL: >-
  <p>Target 5.6: Asigurarea accesului universal la sănătatea sexuală și reproductivă și a  drepturilor reproductive, în conformitate cu prevederile Programului de  acțiuni al Conferinței Internaționale pentru Populație și Dezvoltare și ale  Platformei de acțiune de la Beijing și a documentelor finale ale conferințelor  de revizuire ale acestora.</p>
