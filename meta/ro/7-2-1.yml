STAT_CONC_DEF: >-
  <p>Energie din surse regenerabile reprezintă energia obținută prin valorificarea surselor nefosile regenerabile, respectiv energia eoliană, solară, aerotermală, geotermală, hidrotermală și energia oceanelor, energia hidroelectrică, biomasa, biogazul, gazul de fermentare a deșeurilor (gazul de depozit) și gazul provenit din instalațiile de epurare a apelor uzate.</p>
  <p></p>
  <p>Consumul brut de energie reprezintă produsele energetice furnizate în scopuri energetice industriei, transporturilor, sectorului casnic, serviciilor (inclusiv serviciilor publice), agriculturii, silviculturii și pisciculturii, inclusiv consumul de energie electrică și energie termică din sectorul de producere a energiei electrice și termice, precum și consumul tehnologic și pierderile de energie electrică și energie termică în rețelele electrice și termice.</p>
  <p></p>
  <p>Consumul final brut de energie din surse regenerabile se calculează ca sumă a:</p>
  <p>a) consumului final brut de energie electrică din surse regenerabile;</p>
  <p>b) consumului final brut de energie din surse regenerabile pentru încălzire și răcire;</p>
  <p>c) consumului final brut de energie din surse regenerabile în transporturi.</p>
