STAT_CONC_DEF: >-
  Violența sexuală este definită ca orice act de natură sexuală, intenționat, nedorit și neesențial, finalizat sau doar încercat, comis împotriva unui copil, inclusiv în scopuri de exploatare, care provoacă sau are o probabilitate ridicată de a provoca vătămare, durere sau suferință psihologică. Violența sexuală împotriva unui copil poate lua diverse forme, inclusiv viol, agresiune sexuală sau violență sexuală fără contact fizic.
