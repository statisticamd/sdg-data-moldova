SDG_INDICATOR_INFO__GLOBAL: >-
  Acest indicator este măsurat în cadrul studiilor populaționale naționale și arată proporția  femeilor și bărbaților tineri cu vârsta cuprinsă între 18-29 de ani care declară că au suferit vreo formă de violență sexuală până la vârsta de 18 ani. Acesta este calculat prin împărțirea numărului de femei și bărbați cu vârsta cuprinsă între 18-29 de ani care declară că au suferit vreo formă de violență sexuală până  la vârsta de 18 ani la numărul total de femi și bărbați cu vârsta cuprinsă între 18-29 de ani din populație.
