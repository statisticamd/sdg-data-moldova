STAT_CONC_DEF: >-
  <p> Undernourishment is defined as the condition by which a person has access, on a regular basis, to the amount of food that are insufficient to provide the energy required for conducting a normal, healthy and active life, given his or her own dietary energy requirements.</p> 
  <p>Though strictly related, “undernourishment” as defined here is different from the physical conditions of “malnutrition” and “undernutrition” as it refers to the condition of insufficient intake of food, rather than to the outcome in terms of nutritional status. In French, Spanish and Italian the difference is marked by the use of the terms alimentation, alimentación, or alimentazione, instead of nutrition, nutrición or nutrizione, in the name of the indicator. A more appropriate expression in English that would render the precise meaning of the indicator might have been “prevalence of under-feeding” but by now the term “undernourishment” has long been associated with the indicator.</p> 
  <p>While the undernourishment condition applies to individuals, due to conceptual and data-related considerations, the indicator can only be referred to a population, or group of individuals. The prevalence of undernourishment is thus an estimate of the percentage of individuals in a group that are in that condition, but it does not allow for the identification of which individuals in the group are, in fact, undernourished. </p>
