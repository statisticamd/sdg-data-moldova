COMPARABILITY: >-
  Unlike the global indicator, whose sub-indicator 3 is calculated as an  absolute number of chairs of 5 standing committees (Foreign Affairs, Defence,  Finance, Human Rights and Gender Equality), the national indicator is  calculated as an absolute number of 12 chairs of standing parliamentary  committees established in the XII legislature.
