SDG_INDICATOR_INFO__GLOBAL: >-
  This indicator is collected in national populational surveys and provides the proportion of young women and men aged 18-29 years  who report having experienced any sexual violence by age 18. It is calculated  by dividing the number of young women and men aged 18-29 years who report  having experienced any sexual violence by age 18 by the total number of young  women and men aged 18-29 years, respectively, in the population.
