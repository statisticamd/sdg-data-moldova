STAT_CONC_DEF: >-
  Sexual violence is defined as any deliberate, unwanted and non-essential act of a sexual nature, either completed or attempted, that is perpetrated against a child, including for exploitative purposes, and that results in or has a high likelihood of resulting in injury, pain or psychological suffering. Sexual violence against a child can take many forms including rape, sexual assault or non-contact sexual violence.
