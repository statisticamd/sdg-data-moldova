STAT_CONC_DEF: >-
  <p> Maternity allowance – a cash benefit granted in full from the 30th week of pregnancy to insured women, to wives dependent on employed husbands, and to unemployed women who have been registered with medical institutions and are entitled to maternity leave (which includes prenatal and postnatal leave) for a period of 126 calendar days / 140 calendar days in the case of complicated births or the birth of two children.</p> 
  <p>In the case of pregnancies with three or more fetuses, the maternity allowance is granted from the 24th week of pregnancy for a period of 182 calendar days.</p> 
  <p>(Article 16 of Law No. 289 of 22.07.2004 on temporary incapacity benefits and other social insurance benefits.) </p>
