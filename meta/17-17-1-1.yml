STAT_CONC_DEF: >-
  <p> The Civil Society Organizations Development Programme for the period 2024-2027, approved by Government Decision no. 845/2023, is a continuation of the Civil Society Development Strategy for the period 2018-2020, aiming to support and promote the development of civil society organizations by strengthening the mechanisms of collaboration with the state. The programme is focused on 3 general objectives, which will contribute to making the decision-making process more transparent, strengthening the capacities of civil servants and the representatives of civil society organizations, increasing the involvement of civil society organizations in the decision-making process, increasing the financial stability of CSOs, etc. </p> 
  <p>The monitoring of the programme implementation is ensured by the State Chancellery in the manner described in Chapter IX of the document: Reporting Procedures. The monitoring reports are drawn up biannually. </p>
