SDG_INDICATOR: >-
  <p>Indicator 16.10.2.1: Existence and level of implementation of the regulatory framework on access to information, including: (i) the rate of requests for disclosure of public interest information that are fully satisfied; (ii) the proportion of requests for disclosure of public interest information examined within the legal time limits.</p>
