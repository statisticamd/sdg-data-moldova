COMPARABILITY: >-
  |
  <p>Fully corresponding with the Series "SL_ISV_IFEM_19ICLS - Proportion of informal employment, by sector and sex - 19th ICLS [8.3.1]":</p>
  <p>The national definition of employment is based on the latest international standard - the 19th ICLS Resolution (2013). Starting from 2019, persons who produce goods exclusively for their own consumption are no longer considered part of the employed population.</p>
  <p>Not fully corresponding with the series "SL_ISV_IFEM - Proportion of informal employment, by sector and sex - 13th ICLS [8.3.1]":</p>
  <p>The definition of employment for this global indicator follows the statistical standards of the 13th ICLS (1982). Under this older standard, persons who produce goods exclusively for their own consumption continue to be considered part of employment.</p>
