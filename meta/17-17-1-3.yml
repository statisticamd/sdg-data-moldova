SDG_INDICATOR_INFO: >-
  |
  <p>In accordance with the provisions of the Framework Regulation on the grant funding mechanism for projects of non-profit organizations, approved by Government Decision No. 656/2022, state funding may be provided to CSOs through mechanisms such as grants, contracting of works and services, or through earmarked funding, including social procurement, the percentage allocation mechanism, and direct grants to CSOs. The resources allocated for this purpose are provided for in the state budget and local budgets. </p>
  <p>In accordance with the provisions of the aforementioned decision, any central or local public administration authority may act as a funding authority, organizing, for this purpose, annual public competitions to fund projects in development areas that can be carried out by non-profit organizations.</p>
