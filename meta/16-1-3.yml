STAT_CONC_DEF: >-
  <p> Physical violence committed by husband/partner implied the occurrence of at least one of the following situations:</p> 
  <p>- slapping or throwing things to hit the woman; </p> 
  <p>- pushing, shoving or pulling the woman by hair; </p> 
  <p>- hitting with fists or with anything else that could hurt the woman; </p> 
  <p>- kicking, dragging or beating the woman; </p> 
  <p>- choking or burning on purpose; </p> 
  <p>- threatening or actually using a weapon or other dangerous objects/weapons (knife, ax, lawn mower, etc.).</p> 
  <p>Physical violence committed by other persons than husband/partner: </p> 
  <p>- the woman was at least once pushed, pulled by her hair, slapped, kicked, beaten or had to suffer because of the physical violence acts from other persons than husband/partner.</p> 
  <p>Sexual violence committed by husband/partner implied  the occurrence of at least one of the following situations:</p> 
  <p>- forcing the woman to have sex without  her consent; </p> 
  <p>- forcing the woman to have sex with degrading or humiliating practices; </p> 
  <p>- forcing the woman to have sex by using fear.</p> 
  <p>Sexual violence committee by other persons than husband/partner: </p> 
  <p>- the woman was at least once in the situation to be forced to have unwanted sexual intercourse under threat or by creating situations where she could not refuse. The forced attempts not resulting in a sexual intercourse were not taken into consideration. </p>
