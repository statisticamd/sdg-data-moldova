SOURCE_TYPE: >-
  |
  <p>There are several data sources that could be used:</p>
  <p>1. Official documents such as National Urban Plan, Frameworks, Strategies, etc. Available in national or regional administrations.</p>
  <p>2. Other supporting tools such as: baseline spatial data mapping, benchmarking, point-of-service surveys, performance monitoring and reporting, gap and</p>
  <p>content analysis.</p>
  <p>3. Database of national urban policies by United Nations - and other international organizations, UN-Habitat has developed a National Urban Policy Database as</p>
  <p>a repository of official urban policies documents and related; UN-Habitat has also developed the UrbanLex, a database of laws and policies on urban matters.</p>
