STAT_CONC_DEF: >-
  Proportion of women aged 15-49 years (married or in union) who make their own decision on all three selected areas: decide on their own health care; decide on use of contraception; and can say no to sexual intercourse with their husband or partner if they do not want. Only women who provide a “yes” answer to all three components are considered as women who make their own decisions regarding sexual and reproductive health. A union involves a man and a woman regularly cohabiting in a marriagelike relationship.
