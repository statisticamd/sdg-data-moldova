data_footnote: |
  <p>1. Acordul dintre Guvernul Republicii Moldova și Guvernul Republicii Franceze în domeniul securității sociale a fost semnat la 10 martie 2025, la Paris, și ratificat de Parlamentul Republicii Moldova la 30 aprilie 2025. </p>
  <p>2. Acordul bilateral în domeniul securității sociale între Republica Moldova și Confederația Elvețiană a fost semnat la 2 iunie 2025, la Berna, în urma negocierilor desfășurate în perioada 2022–2024, și ratificat de Parlamentul Republicii Moldova la 3 iulie 2025.	</p>
  <p>3. Acordul dintre Republica Moldova și Republica Italiană în domeniul securității sociale a fost semnat la 31 octombrie 2024 și a intrat în vigoare la 1 septembrie 2025.</p>
