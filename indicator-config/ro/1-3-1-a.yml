data_footnote: <p>Datele cu privire la numărul pensionarilor includ și beneficiarii ale căror pensii  se transferă peste hotare conform acordurilor bilaterale, precum și beneficiari care primesc pensii dar de fapt nu fac parte din populația cu reședință obișnuită, fapt ce explică depășirea ponderii de 100%.</p>
  <p>Începând cu anul 2023 în calcul este utilizat numărul populației cu reședință obișnuită estimat în baza rezultatelor Recensământului Populației și al Locuințelor din anul 2024.</p>
