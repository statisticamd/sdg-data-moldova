page_content: >-
  <p> ***Indicator non-statistic***</p> 
  <p>Numărul de politici pe ani:</p> 
  <p>2013</p> 
  <p>- Strategia de gestionare a deșeurilor în Republica Moldova pentru anii 2013–2027, HG nr. 248/2013</p> 
  <p>- Strategia energetică a Republicii Moldova până în anul 2030, HG nr. 102/2013</p> 
  <p>2014</p> 
  <p>- Strategia de Mediu pentru 2014–2023, HG nr. 301/2014</p> 
  <p>2016</p> 
  <p>- Strategia de dezvoltare cu emisii reduse a Republicii Moldova până în anul 2030 și Planul de acțiuni, HG nr. 1470/2016</p> 
  <p>- Programul național pentru implementarea Protocolului privind Apa și Sănătatea pentru anii 2016–2025, HG nr. 1063/2016</p> 
  <p>2018</p> 
  <p>- Programul de promovare a economiei „verzi” pentru perioada 2018–2020, HG nr. 160/2018.</p> 
  <p>2022</p> 
  <p>- Strategia Națională de Dezvoltare Regională pentru anii 2022–2028, HG nr. 40/2022</p> 
  <p>2023</p> 
  <p>- Strategia națională de sănătate „Sănătatea 2030”, HG nr. 387/2023</p> 
  <p>- Strategia Națională de Dezvoltare Agricolă și Rurală pentru anii 2023–2030, HG nr. 56/2023</p> 
  <p>- Strategia de dezvoltare „Educația – 2030”, HG nr. 114/2023</p> 
  <p>- Programul de dezvoltare cu emisii reduse 2030, HG nr. 659/2023</p> 
  <p>- Programul național de adaptare la schimbările climatice până în anul 2030, HG nr. 624/2023</p> 
  <p>- Programul național de extindere și reabilitare a pădurilor pentru perioada 2023–2032, HG nr. 55/2023</p> 
  <p>- Programul pentru gestionarea deșeurilor pentru anii 2023–2027, HG nr. 972/2023</p> 
  <p>- Programul de management durabil al substanțelor chimice pentru anii 2023–2030, HG nr. 816/2023</p> 
  <p>- Programul Național pentru Promovarea Antreprenoriatului și Creșterea Competitivității pentru perioada 2023–2027, HG nr. 653/2023</p> 
  <p>2024</p> 
  <p>- Strategia de mediu pentru anii 2024–2030 , HG nr. 409/2024</p> 
  <p>- Programul de promovare a economiei verzi și circulare pentru perioada 2024–2028, HG nr. 495/2024</p> 
  <p>- Strategia națională de dezvoltare economică 2030, HG nr. 394/2024 </p>
