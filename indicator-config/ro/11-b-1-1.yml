national_geographical_coverage: Republica Moldova, fără partea stângă a Nistrului și mun. Bender
page_content: >-
  <p> ***Indicator non-statistic***</p> 
  <p>Pentru anul 2022 - Da. </p> 
  <p>Programul de prevenire și gestionare a situațiilor de urgență și excepționale pentru anii 2022-2025, aprobat prin Hotărârea nr. 846/2022. </p> 
  <p>Pentru anul 2023 -Da.</p> 
  <p>Pentru anul 2024 - Da.</p> 
  <p>În anul 2024, prin Hotărârea Guvernului nr. 804/2024, a fost aprobată Strategia națională de reducere a riscurilor de dezastre pentru perioada 2024–2030.</p> 
  <p>Document reprezintă un instrument de realizare a angajamentelor asumate de Republica Moldova în vederea implementării prevederilor Cadrului de la Sendai, Agendei 2030 pentru Dezvoltare Durabilă și Acordului de la Paris. </p> 
  <p>Strategia își propune atingerea următoarelor obiective generale, fiecare dintre acestea fiind însoțit de direcții prioritare și acțiuni concrete pentru implementare:</p> 
  <p>- OG 1: Consolidarea capacității de evaluare și înțelegere a riscurilor de dezastre la nivel național;</p> 
  <p>- OG 2: Consolidarea mecanismelor de coordonare și conducere a măsurilor de reducere a riscurilor și de gestionare a dezastrelor;</p> 
  <p>- OG 3: Promovarea investițiilor pentru reducerea riscurilor și creșterea rezilienței la dezastre;</p> 
  <p>- OG 4: Consolidarea pregătirii și asigurarea unui răspuns eficient la urgențe și dezastre, urmate de restabilirea situației la un nivel mai ridicat decât cel anterior impactului;</p> 
  <p>- OG 5: Intensificarea cooperării internaționale și regionale în domeniul reducerii riscurilor și al managementului dezastrelor. </p>
