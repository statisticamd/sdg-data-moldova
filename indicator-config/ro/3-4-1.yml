data_footnote: |
  <p>Indicatorul a fost recalculat conform noii metodologii, în conformitate cu cerințele internaționale și recomandările Organizației Mondiale a Sănătății (OMS), fiind aliniat la standardele internaționale de calcul și comparabilitate a datelor.</p>
  <p>Indicatorul calculat conform metodologiei anterioare reprezenta raportul dintre numărul de decese cauzate de aceste boli și populația cu vârsta cuprinsă între 30 și 70 de ani, exprimat la 100 000 de locuitori. Acest indicator reflectă rata mortalității în grupul de vârstă 30–70 de ani și nu probabilitatea de deces prematur utilizată în metodologia actuală.</p>
