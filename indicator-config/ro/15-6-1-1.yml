national_geographical_coverage: Republica Moldova, fără partea stângă a Nistrului și mun. Bender
page_content: >-
  <p> ***Indicator non-statistic***</p> 
  <p>Pentru 2016-2018 - Da. </p> 
  <p>Programul național de aderare a Republicii Moldova la Uniunea Europeană pentru anii 2025–2029, aprobat prin Hotărârea Guvernului nr. 306/2025 și modificat prin Hotărârea Guvernului nr. 818/2025, prevede, pentru luna decembrie 2026, aprobarea proiectului de lege privind accesul la resursele genetice și împărțirea corectă și echitabilă a beneficiilor rezultate din utilizarea acestora. De asemenea, proiectul Programului privind biodiversitatea pentru anii 2026–2030, aflat în proces de elaborare și promovare, include măsuri referitoare la accesul la resursele genetice și împărțirea beneficiilor (ABS). </p>
