national_geographical_coverage: Republica Moldova, fără partea stângă a Nistrului și mun. Bender
page_content: >-
  |
  <p>În vederea facilitării migrației și mobilității ordonate, sigure, reglementate și  responsabile a persoanelor, inclusiv prin implementarea unor politici de  migrație planificate și bine gestionate au fost elaborate și aprobate mai multe documente de politici publice, după cum urmează:</p>
  <p>1. HG nr. 21/2023 privind acordarea protecției temporare persoanelor strămutate din Ucraina, aceasta fiind prelungită anual prin HG nr. 141/2024, HG nr.93/2025, HG nr. 26/2026;</p>
  <p>2. Programul național în domeniul migrației și azil și Planul de acțiuni pentru, perioada 2026 - 2030, aprobat prin HG nr. 666/2025;</p>
  <p>3. Programul național de integrare etapizată a străinilor, inclusiv a persoanelor strămutate în Republica Moldova, pentru perioada 2025 - 2027, aprobat prin HG nr. 285/2025; </p>
  <p>4. HG nr. 720/2025 privind aprobarea mecanismelor și metodologiei aplicabile în procedura de azil (mecanismul de acordare a condițiilor materiale de primire acordate solicitanților de azil);</p>
  <p>5. Legea nr. 200/2025 privind libera circulație și ședere a cetățenilor Uniunii Europene și a membrilor de familie ai acestora.</p>
  <p>Totodată, proiectul de lege privind admisia, șederea și supravegherea străinilor în Republica a fost aprobat în prima lectură în anul 2026. Prezentul proiect de lege reprezintă un nou concept și o abordare complexă de reglementare a proceselor migraționale, structura, principiile și conținutul căruia derivă din transpunerea a 12 directive și regulamente ale Uniunii Europene din aceste domenii. Actualmente, regimul juridic al străinilor în Republica Moldova este reglementat de Legea nr. 200/2010 privind regimul străinilor în Republica Moldova. </p>
  <p>În același timp, în februarie 2026, Inspectoratul General pentru Migrație și Agenția Națională pentru Ocuparea Forței de Muncă au încheiat un acord de cooperare, orientat spre consolidarea integrării străinilor, facilitarea accesului acestora la piața muncii și la servicii de suport, prevenirea muncii nedeclarate, precum și diminuarea riscurilor de exploatare prin muncă.</p>
