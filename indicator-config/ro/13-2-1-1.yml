national_geographical_coverage: Republica Moldova, inclusiv partea stângă a Nistrului și mun. Bender
page_content: >-
  <p> ***Indicator non-statistic***</p> 
  <p>În perioada de raportare au fost integrate măsuri privind adaptarea la schimbările climatice și reducerea emisiilor de gaze cu efect de seră în mai multe documente strategice și de politici publice naționale și sectoriale. Aceste măsuri vizează sporirea rezilienței sectoarelor economice, promovarea eficienței energetice, dezvoltarea transportului durabil și consolidarea mecanismelor de monitorizare climatică.</p> 
  <p></p> 
  <p>Acțiunile întreprinse au fost reflectate în documentele oficiale transmise către UNFCCC, inclusiv în Comunicarea Națională 5-a și Raportul Bienal de Transparență (BTR 1) privind emisiile de gaze cu efect de seră, Contribuția Național Determinată 3.0.                                                                                                                                                Contribuția Național Determinată a fost elaborată : 2015; 2020; 2025                        Raport Comunicarea națională a fost elaborat în anii 2010, 2014, 2018, 2022 </p> 
  <p>Raport Bienal actualizat a fost elaborat în anii 2016, 2019, 2021, 2022, 2024 </p> 
  <p>La sfârșitul anului 2023, au fost aprobate Programul național de adaptare la schimbările climatice până în anul 2030 și Planul de acțiuni pentru implementarea acestuia (HG nr. 624/2023), precum și Programul de dezvoltare cu emisii reduse al Republicii Moldova până în anul 2030 (HG nr. 659/2023), care urmează să fie implementate.</p> 
  <p>De asemenea, în anul 2024 au fost aprobate Strategia de mediu pentru anii 2024–2030 (HG nr. 409/2024) și Strategia națională de reducere a riscurilor de dezastre pentru perioada 2024–2030 (HG nr. 804/2024). </p>
