page_content: >-
  <p> ***Non-statistical indicator***</p> 
  <p>For 2016-2018 - Yes</p> 
  <p>The National Programme for the Accession of the Republic of Moldova to the European Union for the years 2025–2029, approved by Government Decision No. 306/2025 and amended by Government Decision No. 818/2025, provides for the approval, in December 2026, of the draft law on access to genetic resources and the fair and equitable sharing of benefits arising from their utilization.</p> 
  <p>Furthermore, the draft Biodiversity Programme for the years 2026–2030, currently under development and promotion, includes measures related to access to genetic resources and benefit-sharing (ABS). </p>
