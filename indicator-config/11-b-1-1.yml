page_content: >-
  <p> ***Non-statistical indicator***</p> 
  <p>For 2022 - Yes. </p> 
  <p>The Programme for the Prevention and Management of Emergency and Exceptional Situations for the years 2022–2025, approved by Government Decision No. 846/2022.</p> 
  <p>For the year 2023 - Yes.</p> 
  <p>For the year 2024 - Yes.</p> 
  <p>In 2024, through Government Decision No. 804/2024, the National Disaster Risk Reduction Strategy for the period 2024–2030 was approved.</p> 
  <p>The document serves as an instrument for fulfilling the commitments undertaken by the Republic of Moldova towards the implementation of the provisions of the Sendai Framework, the 2030 Agenda for Sustainable Development, and the Paris Agreement.</p> 
  <p>The Strategy aims to achieve the following general objectives, each of which is accompanied by priority directions and concrete actions for implementation:</p> 
  <p>- GO 1: Strengthening the capacity for disaster risk assessment and understanding at the national level;</p> 
  <p>- GO 2: Enhancing coordination and leadership mechanisms for disaster risk reduction and disaster management;</p> 
  <p>- GO 3: Promoting investments for risk reduction and increasing disaster resilience;</p> 
  <p>- GO 4: Strengthening preparedness and ensuring an effective response to emergencies and disasters, followed by recovery to a level higher than prior to the impact;</p> 
  <p>- GO 5: Enhancing international and regional cooperation in the field of disaster risk reduction and disaster management.</p> 
  <p>For the purpose of ensuring the reduction of disaster risks, in accordance with the established objective, as well as for the implementation of the multidisciplinary provisions of the Strategy, the relevant sectors (environment, internal affairs, health, infrastructure, economy, etc.) are to develop concrete programs and action plans.</p> 
  <p></p> 
  <p>In this context, draft versions of the National Program for the Reduction of Natural Disaster Risks for the years 2026–2030 and the National Program for the Development of Civil Protection for the years 2026–2030 have been prepared. These are currently in the process of approval and will serve as planning and implementation instruments for the concrete measures related to the intervention areas. </p>
