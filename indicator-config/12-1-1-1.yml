page_content: >-
  <p> ***Non-statistical indicator***</p> 
  <p>Number of policies by year:</p> 
  <p>2013</p> 
  <p>- Waste Management Strategy of the Republic of Moldova for the years 2013–2027, Government Decision No. 248/2013</p> 
  <p>- Energy Strategy of the Republic of Moldova until 2030, Government Decision No. 102/2013</p> 
  <p>2014</p> 
  <p>- Environmental Strategy for 2014–2023, Government Decision No. 301/2014</p> 
  <p>2016</p> 
  <p>- Low Emissions Development Strategy of the Republic of Moldova until 2030 and its Action Plan, Government Decision No. 1470/2016</p> 
  <p>- National Programme for the Implementation of the Protocol on Water and Health for the years 2016–2025, Government Decision No. 1063/2016</p> 
  <p>2018</p> 
  <p>- Programme for Promoting the Green Economy in the Republic of Moldova for the period 2018–2020, Government Decision No. 160/2018</p> 
  <p>2022</p> 
  <p>- National Strategy for Regional Development of the Republic of Moldova for the years 2022–2028, Government Decision No. 40/2022</p> 
  <p>2023</p> 
  <p>- National Health Strategy “Health 2030”, Government Decision No. 387/2023</p> 
  <p>- National Strategy for Agricultural and Rural Development for the years 2023–2030, Government Decision No. 56/2023</p> 
  <p>- Development Strategy “Education – 2030”, Government Decision No. 114/2023</p> 
  <p>- Low Emissions Development Programme 2030, Government Decision No. 659/2023</p> 
  <p>- National Climate Change Adaptation Programme until 2030, Government Decision No. 624/2023</p> 
  <p>- National Programme for Forest Expansion and Rehabilitation for the period 2023–2032, Government Decision No. 55/2023</p> 
  <p>- Waste Management Programme for the years 2023–2027, Government Decision No. 972/2023</p> 
  <p>- Sustainable Chemicals Management Programme for the years 2023–2030, Government Decision No. 816/2023</p> 
  <p>- National Programme for the Promotion of Entrepreneurship and Competitiveness Growth for the period 2023–2027, Government Decision No. 653/2023</p> 
  <p>2024</p> 
  <p>- Environmental Strategy for the years 2024–2030, Government Decision No. 409/2024</p> 
  <p>- Programme for Promoting the Green and Circular Economy in the Republic of Moldova for the period 2024–2028, Government Decision No. 495/2024</p> 
  <p>- National Economic Development Strategy 2030, Government Decision No. 394/2024 </p>
