data_footnote: |
  <p>For 2024, the indicator was calculated based on data available for the first 9 months of the year, as the implementation and configuration of the eCMND information system temporarily limited access to and extraction of detailed data by cause of death.</p>
  <p>During the analyzed period, the indicator for the Republic of Moldova remains at a low level, which corresponds to the situation of a country with wide access of the population to water and sanitation services. Annual fluctuations are mainly determined by the low number of absolute cases and by variations in mortality from diseases sensitive to WASH factors, especially diarrheal diseases.</p>
