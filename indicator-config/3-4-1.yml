data_footnote: |
  <p>The indicator was recalculated according to the new methodology, in accordance with international requirements and recommendations of the World Health Organization (WHO), being aligned with international standards for calculation and data comparability.</p>
  <p>The indicator calculated according to the previous methodology represents the ratio between the number of deaths caused by these diseases and the population aged between 30 and 70 years, expressed per 100,000 inhabitants. This indicator reflects the mortality rate in the age group 30–70 years and not the probability of premature death used in the current methodology.</p>
